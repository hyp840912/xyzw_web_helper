name: Auto Sync Fork
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点（北京时间早上 8点）自动运行
  workflow_dispatch: # 允许你在 Actions 页面手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with upstream
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_repository: w1249178256/xyzw_web_helper
          upstream_branch: main
          target_branch: main
